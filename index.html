<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17130d" />
    <title>수능 D-Day 카운터</title>
    <style>
      :root {
        --ink: #17130d;
        --muted: #776f62;
        --panel: rgba(255, 252, 244, 0.84);
        --line: rgba(23, 19, 13, 0.14);
        --accent: #e85d35;
        --accent-dark: #9c321d;
        --shadow: 0 24px 70px rgba(73, 47, 22, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        font-family: Georgia, "Noto Serif KR", serif;
        background:
          radial-gradient(circle at 10% 5%, rgba(232, 93, 53, 0.18), transparent 28rem),
          radial-gradient(circle at 80% 0%, rgba(31, 122, 77, 0.14), transparent 26rem),
          linear-gradient(135deg, #fff4dc 0%, #f7dfb4 100%);
        min-height: 100vh;
      }

      .hero,
      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
      }

      .hero {
        padding: 36px 0 22px;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h2 {
        margin-bottom: 0;
        font-size: clamp(1.5rem, 3vw, 2.4rem);
        letter-spacing: -0.04em;
      }

      main {
        display: grid;
        gap: 20px;
        padding: 10px 0 56px;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 30px;
        padding: 24px;
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .lead-panel {
        border-color: rgba(232, 93, 53, 0.28);
      }

      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-top: 20px;
      }

      .cards.major-cards {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .event-card {
        min-height: 178px;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: #fffaf0;
      }

      .compact-cards .event-card {
        min-height: 150px;
        background: rgba(255, 250, 240, 0.72);
      }

      .event-card h3 {
        min-height: 54px;
        margin: 18px 0 10px;
        font-size: 1.2rem;
      }

      .date-line {
        margin-bottom: 8px;
        color: var(--muted);
      }

      .organizer-line {
        min-height: 20px;
        margin-bottom: 0;
        color: var(--muted);
        font-family: "Trebuchet MS", sans-serif;
        font-size: 0.86rem;
        font-weight: 800;
      }

      .dday {
        display: block;
        margin-top: 12px;
        color: var(--accent-dark);
        font-size: 2rem;
        letter-spacing: -0.05em;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 6px 10px;
        color: #fffaf0;
        background: var(--ink);
        font-family: "Trebuchet MS", sans-serif;
        font-size: 0.78rem;
        font-weight: 800;
      }

      .muted {
        color: var(--muted);
      }

      @media (max-width: 820px) {
        .hero,
        main {
          width: min(100% - 24px, 520px);
        }

        .hero {
          padding: 24px 0 14px;
        }

        h2 {
          font-size: 1.55rem;
        }

        main {
          gap: 14px;
          padding-bottom: 32px;
        }

        .panel {
          border-radius: 22px;
          padding: 16px;
        }

        .section-head {
          align-items: flex-start;
          flex-direction: column;
          gap: 4px;
        }

        .cards,
        .cards.major-cards {
          grid-template-columns: 1fr;
          gap: 10px;
          margin-top: 14px;
        }

        .event-card,
        .compact-cards .event-card {
          display: grid;
          grid-template-columns: auto 1fr auto;
          gap: 4px 10px;
          align-items: center;
          min-height: 0;
          border-radius: 18px;
          padding: 14px;
        }

        .badge {
          grid-row: 1 / span 2;
          justify-self: start;
          padding: 6px 9px;
          font-size: 0.72rem;
        }

        .event-card h3 {
          min-height: 0;
          margin: 0;
          font-size: 1rem;
          line-height: 1.28;
        }

        .date-line,
        .organizer-line {
          margin: 0;
          font-size: 0.86rem;
          line-height: 1.3;
        }

        .organizer-line {
          min-height: 0;
          grid-column: 2 / 4;
        }

        .dday {
          grid-column: 3;
          grid-row: 1 / span 2;
          margin: 0;
          font-size: 1.45rem;
          text-align: right;
          white-space: nowrap;
        }
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <div class="title-block">
        <h2>수능 D-Day 카운터</h2>
      </div>
    </header>

    <main>
      <section class="panel lead-panel">
        <div class="section-head">
          <div>
            <h2>평가원 모의평가</h2>
          </div>
        </div>
        <div class="cards major-cards" id="majorCards"></div>
      </section>

      <section class="panel">
        <div class="section-head">
          <div>
            <h2>교육청 모의고사</h2>
          </div>
        </div>
        <div class="cards compact-cards" id="otherCards"></div>
      </section>
    </main>

    <template id="cardTemplate">
      <article class="event-card">
        <span class="badge"></span>
        <h3></h3>
        <p class="date-line"></p>
        <p class="organizer-line"></p>
        <strong class="dday"></strong>
      </article>
    </template>

    <script>
      const MAJOR_TYPES = new Set(["6모", "9모", "수능"]);

      const EVENTS = [
        {
          id: "2026-march-mock",
          year: 2026,
          type: "3모",
          name: "3월 고3 전국연합학력평가",
          date: "2026-03-24",
          organizer: "서울특별시교육청",
          active: true,
        },
        {
          id: "2026-may-mock",
          year: 2026,
          type: "5모",
          name: "5월 고3 전국연합학력평가",
          date: "2026-05-07",
          organizer: "경기도교육청",
          active: true,
        },
        {
          id: "2026-june-mock",
          year: 2026,
          type: "6모",
          name: "2027학년도 6월 모의평가",
          date: "2026-06-04",
          organizer: "한국교육과정평가원",
          active: true,
        },
        {
          id: "2026-july-mock",
          year: 2026,
          type: "7모",
          name: "7월 고3 전국연합학력평가",
          date: "2026-07-08",
          organizer: "인천광역시교육청",
          active: true,
        },
        {
          id: "2026-september-mock",
          year: 2026,
          type: "9모",
          name: "2027학년도 9월 모의평가",
          date: "2026-09-02",
          organizer: "한국교육과정평가원",
          active: true,
        },
        {
          id: "2026-october-mock",
          year: 2026,
          type: "10모",
          name: "10월 고3 전국연합학력평가",
          date: "2026-10-20",
          organizer: "서울특별시교육청",
          active: true,
        },
        {
          id: "2026-suneung",
          year: 2026,
          type: "수능",
          name: "2027학년도 대학수학능력시험",
          date: "2026-11-19",
          organizer: "한국교육과정평가원",
          active: true,
        },
      ];

      const elements = {
        majorCards: document.querySelector("#majorCards"),
        otherCards: document.querySelector("#otherCards"),
        template: document.querySelector("#cardTemplate"),
      };

      function toDateKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function parseLocalDate(dateKey) {
        const [year, month, day] = dateKey.split("-").map(Number);
        return new Date(year, month - 1, day);
      }

      function todayKey() {
        return toDateKey(new Date());
      }

      function daysUntil(dateKey) {
        const today = parseLocalDate(todayKey());
        const target = parseLocalDate(dateKey);
        return Math.ceil((target - today) / 86400000);
      }

      function formatDate(dateKey) {
        return new Intl.DateTimeFormat("ko-KR", {
          year: "numeric",
          month: "long",
          day: "numeric",
          weekday: "short",
        })
          .format(parseLocalDate(dateKey))
          .replace(/\.$/, "");
      }

      function formatDday(dateKey) {
        const days = daysUntil(dateKey);
        if (days === 0) return "D-Day";
        if (days > 0) return `D-${days}`;
        return `D+${Math.abs(days)}`;
      }

      function normalizeEvents(events) {
        return events
          .filter((event) => event.active !== false)
          .map((event) => ({
            id: event.id || `${event.year}-${event.type}-${event.date}`,
            year: Number(event.year),
            type: event.type || "기타",
            name: event.name || "이름 없는 일정",
            date: event.date,
            organizer: event.organizer || "",
          }))
          .sort((a, b) => a.date.localeCompare(b.date));
      }

      function renderCards(container, events) {
        container.innerHTML = "";

        if (!events.length) {
          container.innerHTML = '<p class="muted">표시할 일정이 없습니다.</p>';
          return;
        }

        events.forEach((event) => {
          const card = elements.template.content.cloneNode(true);
          card.querySelector(".badge").textContent = event.type;
          card.querySelector("h3").textContent = event.name;
          card.querySelector(".date-line").textContent = formatDate(event.date);
          card.querySelector(".organizer-line").textContent = event.organizer;
          card.querySelector(".dday").textContent = formatDday(event.date);
          container.append(card);
        });
      }

      const events = normalizeEvents(EVENTS);
      renderCards(elements.majorCards, events.filter((event) => MAJOR_TYPES.has(event.type)));
      renderCards(elements.otherCards, events.filter((event) => !MAJOR_TYPES.has(event.type)));
    </script>
  </body>
</html>
